# EXAMPLE customer server block. Pairs with the http block in nginx.conf.
#
# Nothing here is agent-specific: the Tier 2 `deny` lines already apply from
# the http context. The one line that matters is limit_req, which activates
# the zone defined in nginx.conf for this server.

server {
    listen 80;
    server_name _;

    # Tier 1. Harmless for every IP the backend has not flagged: their key in
    # the zone is the empty string, so the limit does not apply to them.
    # burst absorbs a short legitimate spike; nodelay serves the burst
    # immediately rather than queueing it.
    limit_req zone=aiops_tier1 burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        # Without this the upstream sees nginx's address. It does not affect
        # the agent — the agent reads the access log, where $remote_addr is
        # already the real client — but an upstream that logs or rate-limits
        # on its own needs the real address too.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
