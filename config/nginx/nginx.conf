user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"time_iso8601":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    keepalive_timeout 65;

    # ── Rate Limiting Zones ───────────────────────────────────────
    # Global rate limit: max requests per second per IP
    limit_req_zone $binary_remote_addr
        zone=global_limit:10m
        rate=${NGINX_RATE_LIMIT_RPS}r/s;

    # Strict rate limit for sensitive endpoints (static, path-based —
    # applies to every IP hitting /login, /api/auth, /admin)
    limit_req_zone $binary_remote_addr
        zone=strict_limit:10m
        rate=${NGINX_STRICT_RATE_LIMIT_RPS}r/s;

    # ── Tier 1 dynamic per-IP rate limit (ML-triggered) ────────────
    # Distinct from strict_limit above: this applies to specific IPs the
    # AI Engine flagged as anomalous (any path), not to sensitive paths
    # for everyone. $strict_ip is 1 only for IPs the worker-orchestrator
    # has written into the nginx-ratelimit ConfigMap (mounted as one file
    # per IP under /etc/nginx/ratelimit/, same pattern as blocklist.d);
    # every other IP gets an empty $strict_key, which nginx's limit_req
    # treats as "no limit" for that zone. NOTE: $binary_remote_addr is
    # only correct when traffic hits this pod directly (NodePort) — if a
    # load balancer is ever placed in front, switch to a validated
    # X-Forwarded-For value.
    geo $strict_ip {
        default 0;
        include /etc/nginx/ratelimit/*;
    }
    map $strict_ip $strict_key {
        1 $binary_remote_addr;
        0 "";
    }
    limit_req_zone $strict_key
        zone=ml_tier1:10m
        rate=${NGINX_STRICT_RATE_LIMIT_RPS}r/s;

    # Rate limit response
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
