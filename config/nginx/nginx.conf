# EXAMPLE customer nginx configuration — the http block.
#
# This is not part of the product. It is the reference config a customer puts
# on their own machine so the agent's two enforcement adapters actually take
# effect. The agent writes two files into /etc/nginx/conf.d and reloads nginx;
# this file is the half that has to exist for those files to mean anything.
#
# WHAT THE AGENT WRITES (services/agent/enforcer/nginx_adapter.py)
#   aiops-agent-deny.conf  — `deny <ip>;` lines, one per Tier 2 hard block
#   aiops-agent-geo.conf   — a `geo $binary_remote_addr $agent_rate_limited`
#                            map marking Tier 1 rate-limited IPs with 1
#
# The agent never edits this file. It owns those two and nothing else, so a
# customer can restructure everything here without breaking enforcement.
#
# The previous file of this name configured the superseded architecture: it
# read its rate-limit list from a Kubernetes ConfigMap patched by a
# worker-orchestrator service that no longer exists (ADR-002).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Access log: this is what the agent reads --------------------------
    # The collector needs source IP, timestamp, method, path, status, bytes
    # sent and request time — the seven features are computed from these. A
    # log line missing $request_time or $body_bytes_sent yields a feature
    # vector the model was not trained on.
    log_format aiops '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log aiops;

    # ---- Enforcement, included BEFORE anything that references it ----------
    # The wildcard matters twice: it tolerates the files not existing yet (a
    # fresh install, before the agent has ever enforced anything), and it
    # guarantees the `geo` block below is parsed before limit_req_zone needs
    # the variable it defines. Both `deny` and `geo` are valid in the http
    # context, so blocks here apply to every server block.
    include /etc/nginx/conf.d/aiops-agent-*.conf;

    # ---- Tier 1: rate limit, but only for flagged IPs ----------------------
    # An empty limit_req_zone key disables the zone for that request, which is
    # nginx's documented way to apply a limit selectively. So unflagged
    # traffic is untouched, and an IP the backend flagged is limited without
    # the agent having to rewrite any server block.
    map $agent_rate_limited $aiops_limited_addr {
        1       $binary_remote_addr;
        default "";
    }
    limit_req_zone $aiops_limited_addr zone=aiops_tier1:10m rate=10r/s;

    # A rejected request must still be a cheap request.
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
