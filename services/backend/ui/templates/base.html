<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Traffic Shaper{% endblock %}</title>
<script src="/ui/static/interactions.js" defer></script>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --border: #e3e6ee;
    --text: #1a1d29;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --success: #15803d;
    --success-bg: #ecfdf3;
    --warning: #b45309;
    --warning-bg: #fffbeb;
    --danger: #b91c1c;
    --danger-bg: #fef2f2;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); padding: 20px 16px;
  }
  .brand { font-weight: 700; font-size: 15px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .nav-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 18px 0 6px 8px; }
  .nav-link {
    display: block; padding: 8px 10px; border-radius: 8px; color: var(--text);
    font-weight: 500; margin-bottom: 2px;
  }
  .nav-link:hover { background: var(--bg); text-decoration: none; }
  .nav-link.active { background: #eef2ff; color: var(--accent); }
  .sidebar-footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); }

  .main { flex: 1; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .content { padding: 28px; max-width: 1100px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .card-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }

  .stat { }
  .stat .stat-value { font-size: 26px; font-weight: 700; }
  .stat .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em;
       color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-neutral { background: var(--bg); color: var(--text-muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 7px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--bg); text-decoration: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger-bg); border-color: #fecaca; color: var(--danger); }
  .btn-danger:hover { background: #fee2e2; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  input[type=text], input[type=password], select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    min-width: 200px; background: var(--surface); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid #c7d2fe; border-color: var(--accent); }

  .empty-state { text-align: center; padding: 36px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }

  .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 13px; font-weight: 500; }
  .alert-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
  .alert-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }

  .htmx-swapping { opacity: 0.4; transition: opacity 200ms ease-out; }

  @media (max-width: 720px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .content { padding: 16px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
